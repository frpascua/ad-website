<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access unirioja workspace</title>
  <link rel="stylesheet" href="/public/css/styles.css">
</head>

<body>
  <div class="login-container">
    <div class="login-box">
      <div class="logo">
        <img src="/public/assets/images/dev-tasker-logo.png" style="  mix-blend-mode: screen; height: 128px;" />
      </div>

      <h1>Welcome to <span style="color: #7159B5;">unirioja</span> workspace</h1>
      <p class="subtitle">Accede con tu cuenta de la Universidad de La Rioja.</p>

      <a href="/api/auth/login" class="btn-primary" id="ssoBtn" role="button" style="text-decoration: none;">
        Iniciar sesión con SSO UniRioja
      </a>

      <div class="info-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
          <path d="M12 16V12M12 8H12.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
        <p>Serás redirigido al inicio de sesión único (SSO) de la Universidad de La Rioja para autenticarte de forma segura.</p>
      </div>
    </div>

    <footer>
      <p>Made with ❤️ at Universidad de La Rioja</p>
    </footer>
  </div>
</body>

</html>
