<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticación - Supabase</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <h1>Bienvenido</h1>
            <p class="subtitle">Inicia sesión con un enlace mágico enviado a tu email</p>
            
            <!-- Formulario de Magic Link -->
            <div id="magic-link-form">
                <form onsubmit="handleMagicLink(event)">
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input 
                            type="email" 
                            id="email" 
                            placeholder="tu@email.com"
                            required>
                    </div>
                    <button type="submit" class="btn-primary">
                        ✉️ Enviar enlace mágico
                    </button>
                </form>
                <p class="message" id="magic-link-message"></p>
            </div>

         
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
</body>
</html>
